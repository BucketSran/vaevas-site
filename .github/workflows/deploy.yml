name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *" # 每 6 小时重新读取 vaEVAS main 与 Issue
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TZ: Asia/Shanghai # 页脚和看板按北京时间显示

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out vaEVAS main (only the imported paths)
        uses: actions/checkout@v4
        with:
          repository: BucketSran/vaEVAS
          path: vaEVAS
          filter: blob:none
          sparse-checkout: |
            evas/docs
            benchmark/tasks
            benchmark/material/draftbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/sync_main.py --repo vaEVAS --ref HEAD --no-fetch
      - run: python tools/sync_issues.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -m mkdocs build --strict
      - run: python tools/check_links.py
      - run: python tools/check_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
